name: Build and Release RcloneManager

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build EXE on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: ensure a C compiler is available (Fyne needs cgo)
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y
          }

      # ── 1. 상태 변수 설정 (수동/자동 완벽 분기) ──
      - name: Set Build Context
        id: context
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            # [수동 실행] 타임스탬프 태그 생성 / 버전 업데이트 안 함 / 프리 릴리스
            $tag = "v" + (Get-Date -Format "yyyyMMdd-HHmmss")
            echo "TAG_NAME=$tag" >> $env:GITHUB_ENV
            echo "SHOULD_UPDATE_VERSION=false" >> $env:GITHUB_ENV
            echo "PRERELEASE=true" >> $env:GITHUB_ENV
            echo "Mode: Manual (No version update, Pre-release)"
          } else {
            # [릴리스 발행] 태그 사용 / 버전 업데이트 수행 / 정식 릴리스
            $tag = "${{ github.event.release.tag_name }}"
            $cleanVer = $tag.TrimStart('v')
            echo "TAG_NAME=$tag" >> $env:GITHUB_ENV
            echo "CLEAN_VERSION=$cleanVer" >> $env:GITHUB_ENV
            echo "SHOULD_UPDATE_VERSION=true" >> $env:GITHUB_ENV
            echo "PRERELEASE=false" >> $env:GITHUB_ENV
            echo "Mode: Release (Version update to $cleanVer, Official)"
          }

      # ── 2. 소스 코드 내 appVersion 수정 + 커밋 + Push (충돌 시 재시도) ──
      # 원격 main이 그 사이 앞서갔으면(다른 push, 이전 실행의 잔여 커밋 등)
      # 단순 push는 rejected로 실패한다. 이 edit이 "항상 같은 목표 버전으로
      # 맞추는" 멱등적인 작업이라, 실패하면 최신 원격 상태로 리셋 후 같은
      # edit을 다시 적용해 재시도하는 방식으로 안전하게 처리한다.
      - name: Update appVersion, commit, and push (with retry on conflict)
        if: env.SHOULD_UPDATE_VERSION == 'true'
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          function Apply-VersionBump {
            $filePath = "cmd/gui/main.go"
            $newVersion = "${{ env.CLEAN_VERSION }}"
            (Get-Content $filePath) -replace 'const appVersion = ".*"', "const appVersion = `"$newVersion`"" | Set-Content $filePath
            git add cmd/gui/main.go
            git commit -m "chore: update version to $newVersion [skip ci]"
          }

          Apply-VersionBump

          $branch = "${{ github.event.release.target_commitish }}"
          $maxRetries = 5
          for ($i = 1; $i -le $maxRetries; $i++) {
            git push origin "HEAD:$branch"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Push succeeded (attempt $i/$maxRetries)"
              break
            }
            if ($i -eq $maxRetries) {
              Write-Host "Push failed after $maxRetries attempts"
              exit 1
            }
            Write-Host "Push rejected (attempt $i/$maxRetries) — fetching latest and reapplying version bump"
            git fetch origin $branch
            git reset --hard "origin/$branch"
            Apply-VersionBump
          }

      - name: Build with go build
        run: go build -ldflags -H=windowsgui -o RcloneManager.exe ./cmd/gui

      - name: Create ZIP archive
        run: Compress-Archive -Path RcloneManager.exe -DestinationPath RcloneManager.zip

      # ── 3. 릴리스 업로드 ──
      - name: Upload Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: RcloneManager.zip
          prerelease: ${{ env.PRERELEASE }}

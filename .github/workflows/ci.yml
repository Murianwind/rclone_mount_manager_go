name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: install Fyne build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev

      - name: go vet (engine)
        run: go vet ./internal/...

      - name: go vet (gui)
        run: go vet ./cmd/gui/...

      - name: Run go test with coverage
        run: |
          set +e
          go test -v ./internal/... -coverprofile=coverage.out 2>&1 | tee engine-test-output.txt
          ENGINE_EXIT=${PIPESTATUS[0]}
          go test -v ./cmd/gui/... 2>&1 | tee gui-test-output.txt
          GUI_EXIT=${PIPESTATUS[0]}
          cat engine-test-output.txt gui-test-output.txt > go-test-output.txt

          if [ "$ENGINE_EXIT" != "0" ] || [ "$GUI_EXIT" != "0" ]; then
            echo "TEST_EXIT=1" >> $GITHUB_ENV
            exit 1
          fi
          echo "TEST_EXIT=0" >> $GITHUB_ENV

      - name: Publish Test Summary
        if: always()
        run: |
          PASS_COUNT=$(grep -cE "^\s*--- PASS:" go-test-output.txt || true)
          FAIL_COUNT=$(grep -cE "^\s*--- FAIL:" go-test-output.txt || true)
          if [ "${TEST_EXIT:-0}" = "0" ]; then
            echo "### Go 테스트 결과: 전체 통과" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Go 테스트 결과: 실패 있음" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PASS ${PASS_COUNT}건 / FAIL ${FAIL_COUNT}건**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^\s*--- (PASS|FAIL):" go-test-output.txt \
            | sed -E 's/^\s*--- PASS: /✓  /' \
            | sed -E 's/^\s*--- FAIL: /✗  FAILED  /' \
            >> $GITHUB_STEP_SUMMARY || echo "(없음)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL_COUNT" -gt "0" ]; then
            echo "### 실패 상세" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            awk '
              /^=== RUN/ { last_run = NR }
              { lines[NR] = $0 }
              /^\s*--- FAIL:/ {
                for (i = last_run; i <= NR; i++) print lines[i]
                print ""
              }
            ' go-test-output.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate Coverage Report
        if: always() && hashFiles('coverage.out') != ''
        run: |
          echo "### 구문 커버리지 상세 (Statement Coverage)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 파일 경로 | 실행 가능 구문 | 실행 안 됨 | 구문 커버리지(%) |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|---:|---:|---:|" >> $GITHUB_STEP_SUMMARY
          awk '
            NR>1 {
              split($0, parts, " ")
              split(parts[1], fp, ":")
              file = fp[1]
              stmts = parts[2]
              count = parts[3]
              total[file] += stmts
              if (count+0 > 0) covered[file] += stmts
            }
            END {
              for (f in total) {
                miss = total[f] - covered[f]
                pct = (total[f] > 0) ? (covered[f] / total[f] * 100) : 0
                printf "%s|%d|%d|%.1f\n", f, total[f], miss, pct
              }
            }
          ' coverage.out | sort | while IFS='|' read -r file stmts miss pct; do
            echo "| $file | $stmts | $miss | **${pct}%** |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          TOTAL_PCT=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')
          echo "**전체 구문 커버리지: ${TOTAL_PCT}**" >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage to Codecov
        if: always() && hashFiles('coverage.out') != ''
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: true
          verbose: true
          use_oidc: true

      - name: Windows cross-compile check (engine only)
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/RcloneManager.exe ./internal/...

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: ensure a C compiler is available (Fyne needs cgo)
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y
          }

      - name: build check (GUI compiles for Windows)
        run: go build -ldflags -H=windowsgui -o RcloneManager.exe ./cmd/gui

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: install Fyne build deps (Linux headers, cmd/gui only builds/tests here — not distributed)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev

      - name: go vet (engine)
        run: go vet ./internal/...

      - name: go vet (gui — pure-logic helpers only; actual Windows build is validated on windows-latest)
        run: go vet ./cmd/gui/...

      - name: go test (engine, with coverage)
        run: go test ./internal/... -v -coverprofile=coverage.out

      - name: go test (gui pure-logic helpers)
        run: go test ./cmd/gui/... -v

      - name: coverage summary
        run: go tool cover -func=coverage.out

      - name: upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Windows cross-compile check (engine only)
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/RcloneManager.exe ./internal/...

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: ensure a C compiler is available (Fyne needs cgo)
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y
          }

      - name: build check (GUI compiles for Windows)
        run: go build -ldflags -H=windowsgui -o RcloneManager.exe ./cmd/gui

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: go vet (engine only — cmd/gui needs cgo, validated on windows-latest)
        run: go vet ./internal/...

      - name: go test (with coverage)
        run: go test ./internal/... -v -coverprofile=coverage.out

      - name: coverage summary
        run: go tool cover -func=coverage.out

      - name: upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Windows cross-compile check (engine only)
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/RcloneManager.exe ./internal/...

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: ensure a C compiler is available (Fyne needs cgo)
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y
          }

      - name: build RcloneManager.exe (GUI)
        run: go build -o RcloneManager.exe ./cmd/gui

      - uses: actions/upload-artifact@v4
        with:
          name: RcloneManager-windows
          path: RcloneManager.exe
